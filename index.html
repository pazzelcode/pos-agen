<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS Konter & Agen</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<header class="topbar">
  <div>
    <h1 id="nama-toko-judul">POS KONTER & AGEN</h1>
    <small id="sub-toko" style="color:#94a3b8;font-size:.72rem"></small>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="tanggal-hari"></span>
    <button type="button" id="btn-toggle-cfg" style="background:#3a86ff;color:#fff;border:none;padding:5px 9px;border-radius:6px;font-size:.75rem;font-weight:700;cursor:pointer">Toko</button>
  </div>
</header>
<main class="container">
  <section id="cfg-box" class="card form-box" style="display:none">
    <h2>Profil Konter / Agen</h2>
    <form id="cfg-form">
      <label>Nama Konter / Agen</label>
      <input type="text" id="cfg-nama" placeholder="Cth: TOKO ALSAD / ALSAD LINK" required>
      <label>Alamat / Info Singkat</label>
      <input type="text" id="cfg-alamat" placeholder="Cth: Jl. Raya Sagaranten">
      <div class="grid-3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;">
        <button type="submit" class="btn-primary">Simpan</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:8px 10px;background:#0b132b;border:1px solid #334155;border-radius:8px;font-size:.78rem">
        <span>ID Perangkat: <strong id="info-dev-id" style="color:#ffd166">-</strong></span>
        <button type="button" id="btn-salin-id" style="background:#475569;color:#fff;border:none;padding:4px 9px;border-radius:6px;font-size:.72rem;font-weight:700;cursor:pointer">Salin ID</button>
      </div>
      <div id="audit-box" style="margin-top:6px;padding:10px;background:#091024;border:1px solid #1e293b;border-radius:8px;display:grid;gap:6px">
        <div style="font-size:.78rem;font-weight:700;color:#ffd166">Audit &amp; Tarik Data Periode</div>
        <label style="font-size:.74rem;color:#cbd5e1">Pilih Bulan (Otomatis isi awal-akhir bulan)
          <input type="month" id="audit-bulan" style="width:100%;margin-top:3px;padding:6px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff">
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <label style="font-size:.74rem;color:#cbd5e1">Dari Tanggal
            <input type="date" id="audit-dari" style="width:100%;margin-top:3px;padding:6px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff">
          </label>
          <label style="font-size:.74rem;color:#cbd5e1">Sampai Tanggal
            <input type="date" id="audit-sampai" style="width:100%;margin-top:3px;padding:6px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff">
          </label>
        </div>
        <div id="audit-ringkasan" style="font-size:.74rem;color:#94a3b8">Periode: belum dipilih</div>
        <div style="display:grid;grid-template-columns:1fr;gap:6px">
          <button type="button" id="btn-audit-csv" style="background:#0284c7;color:#fff;border:none;padding:8px;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer">Tarik CSV Audit (Buka di Excel / WPS)</button>
        </div>
      </div>
    </form>
  </section>
  <section class="summary-grid">
    <div class="card">
      <small>Omzet / Masuk</small>
      <strong id="total-masuk">Rp0</strong>
    </div>
    <div class="card accent">
      <small>Laba / Fee Bersih</small>
      <strong id="total-laba">Rp0</strong>
    </div>
    <div class="card">
      <small>Jumlah Trx</small>
      <strong id="total-trx">0</strong>
    </div>
  </section>
  <section class="card form-box">
    <h2>Input Transaksi</h2>
    <form id="trx-form">
      <label>Jenis Layanan</label>
      <div style="display:flex;gap:8px;align-items:center;"><select id="jenis" required style="flex:1;"></select><button type="button" id="btn-add-jenis" title="Tambah Layanan" aria-label="Tambah Layanan" style="padding:8px 12px;font-weight:bold;cursor:pointer;">+</button></div>
      <label for="tujuan">Tujuan</label>
      <input type="text" id="tujuan" placeholder="Cth: nama pelanggan / nama barang" required>
      <label for="ket">Keterangan</label>
      <input type="text" id="ket" placeholder="Cth: nominal / Jumlah / Jenis barang" required>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <div>
          <label>Harga Jual (Rp)</label>
          <input type="number" id="jual" min="0" placeholder="105000" required>
        </div>
        <div>
          <label>Modal (Rp)</label>
          <input type="number" id="modal" min="0" placeholder="100000" required>
        </div>
        <div>
          <label>Laba (Rp)</label>
          <input type="text" id="laba-preview" value="Rp0" readonly style="background:#1e293b;color:#4ade80;font-weight:700">
        </div>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:8px;">Simpan Transaksi</button>
    </form>
  </section>
  <section class="card list-box">
    <div class="list-head">
      <h2>Riwayat Transaksi</h2>
      <div style="display:flex;gap:6px"><button type="button" id="btn-csv" style="background:#f59e0b;color:#111827;border:none;padding:6px 10px;border-radius:6px;font-size:.75rem;font-weight:700;cursor:pointer">Export CSV</button><button type="button" id="btn-reset" class="btn-danger">Reset Hari Ini</button></div>
    </div>
    <input type="search" id="cari-trx" placeholder="Cari layanan, nama, nomor HP, atau bank..." style="margin-bottom:10px">
    <ul id="trx-list" class="trx-list"></ul>
  </section>
</main>
<script src="js/app.js"></script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>
</body>
</html>
