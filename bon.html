<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Bon & Tempo Tagihan - POS Konter & Agen</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .bon-page-wrap{max-width:720px;margin:0 auto;padding:14px 12px 40px}
    .bon-top-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
    .bon-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .bon-stat-card{padding:10px;border-radius:10px;background:rgba(15,23,42,.75);border:1px solid rgba(148,163,184,.25)}
    .bon-stat-card small{display:block;color:#94a3b8;font-size:11px}
    .bon-stat-card strong{font-size:14px;color:#f8fafc}
    .bon-chip-bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
    .bon-chip-btn{padding:6px 10px;border-radius:8px;border:1px solid rgba(148,163,184,.3);background:rgba(15,23,42,.65);color:#cbd5e1;font-size:12px;font-weight:600;cursor:pointer}
    .bon-chip-btn.aktif{background:#e11d48;border-color:#fb7185;color:#fff}
    .bon-tempo-cepat{display:flex;gap:6px;margin-top:6px}
    .bon-tempo-cepat button{padding:4px 8px;border-radius:6px;border:1px solid rgba(148,163,184,.3);background:rgba(30,41,59,.8);color:#e2e8f0;font-size:11px;cursor:pointer}
    .bon-btn-tunda{padding:5px 8px;border-radius:7px;border:1px solid rgba(148,163,184,.35);background:rgba(30,41,59,.85);color:#f8fafc;font-size:11px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="bon-page-wrap">
    <header class="bon-top-bar">
      <div>
        <h1 style="margin:0;font-size:18px">Buku Bon & Tempo Tagihan</h1>
        <small style="color:#94a3b8">Pantau jatuh tempo pelanggan & kirim tagihan WA</small>
      </div>
      <a href="index.html" class="btn-riwayat" style="display:inline-flex;align-items:center;justify-content:center;padding:8px 11px;border-radius:7px;font-size:.75rem;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0">Kembali ke POS</a>
    </header>

    <section class="bon-stat-grid">
      <div class="bon-stat-card"><small>Piutang Aktif</small><strong id="bon-stat-aktif">Rp 0</strong></div>
      <div class="bon-stat-card"><small>Lewat / Hari Ini</small><strong id="bon-stat-mendesak" class="bon-tag-merah">0</strong></div>
      <div class="bon-stat-card"><small>Sudah Lunas</small><strong id="bon-stat-lunas">Rp 0</strong></div>
    </section>

    <section class="card form-box" style="margin-bottom:12px">
      <h2 style="margin-top:0">Catat Bon Baru</h2>
      <form id="form-bon-baru">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><label for="bon-nama">Nama / Tujuan</label><input type="text" id="bon-nama" placeholder="Cth: Budi / 0812..." required></div>
          <div><label for="bon-wa">No. WA (Opsional)</label><input type="text" id="bon-wa" placeholder="081234567890"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <div><label for="bon-jenis">Jenis Layanan</label><input type="text" id="bon-jenis" value="Pulsa" required></div>
          <div><label for="bon-ket">Keterangan</label><input type="text" id="bon-ket" placeholder="Cth: Paket 25rb" required></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <div><label for="bon-jual">Tagihan / Harga Jual</label><input type="number" id="bon-jual" min="0" required></div>
          <div><label for="bon-modal">Modal (Rp)</label><input type="number" id="bon-modal" min="0" required></div>
        </div>
        <div id="bon-laba-info" style="margin-top:6px;font-size:12px;color:#94a3b8">Estimasi Laba: <strong id="bon-laba-preview" style="color:#34d399">Rp 0</strong></div>
        <div style="margin-top:8px">
          <label for="bon-tempo">Tanggal Jatuh Tempo</label>
          <input type="date" id="bon-tempo" required>
          <div class="bon-tempo-cepat">
            <button type="button" data-plus="1">+1 Hari</button>
            <button type="button" data-plus="3">+3 Hari</button>
            <button type="button" data-plus="7">+7 Hari</button>
          </div>
        </div>
        <button type="submit" class="btn-primary" style="margin-top:10px">Simpan Catatan Bon</button>
      </form>
    </section>

    <section class="card list-box">
      <h2 style="margin-top:0">Daftar Tagihan Pelanggan</h2>
      <input type="search" id="bon-cari" placeholder="Cari nama pelanggan, layanan, atau keterangan...">
      <div class="bon-chip-bar">
        <button type="button" class="bon-chip-btn aktif" data-st="belum">Belum Lunas</button>
        <button type="button" class="bon-chip-btn" data-st="lewat">Lewat Tempo</button>
        <button type="button" class="bon-chip-btn" data-st="hari_ini">Hari Ini</button>
        <button type="button" class="bon-chip-btn" data-st="lunas">Lunas</button>
        <button type="button" class="bon-chip-btn" data-st="semua">Semua Bon</button>
      </div>
      <div id="bon-rekap-pelanggan" style="margin-bottom:10px"></div>
      <div id="bon-halaman-list" class="bon-list"></div>
    </section>
  </div>
  <script src="js/bon.js"></script>
</body>
</html>
